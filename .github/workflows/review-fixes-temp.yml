          smoke = Path('test/smoke-codebuff.mjs')
          s = smoke.read_text()
          s = s.replace("import { fileURLToPath } from 'node:url'", "import { fileURLToPath, pathToFileURL } from 'node:url'\nimport { createRequire } from 'node:module'")
          s = s.replace("let sdk = null\ntry {\n  sdk = await import('@codebuff/sdk')\n} catch {", "const sdkRoot = process.env.OMF_CODEBUFF_SDK_ROOT\n  ? path.resolve(process.env.OMF_CODEBUFF_SDK_ROOT)\n  : ROOT\nconst sdkRequire = createRequire(path.join(sdkRoot, 'package.json'))\nlet sdk = null\nlet sdkEntry = null\ntry {\n  sdkEntry = sdkRequire.resolve('@codebuff/sdk')\n  sdk = await import(pathToFileURL(sdkEntry).href)\n} catch {")
          s = s.replace("const dts = path.join(ROOT, 'node_modules', '@codebuff', 'sdk', 'dist', 'index.d.ts')", "const dts = path.join(path.dirname(sdkEntry), 'index.d.ts')")
          smoke.write_text(s)
          PY

