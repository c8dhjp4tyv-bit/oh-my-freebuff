          # Stable fixture package. package-lock.json is generated in the next step
          # by npm itself and committed by this one-shot workflow.
          fixture = Path('test/fixtures/codebuff-sdk-0.10.7')
          fixture.mkdir(parents=True, exist_ok=True)
