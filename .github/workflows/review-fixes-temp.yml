name: Apply review fixes temporary

on:
  push:
    branches:
      - feat/v0.3.0-hardening

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3.0-hardening
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/apply-review-fixes.mjs
      - run: npm install --package-lock-only --ignore-scripts --prefix test/fixtures/codebuff-sdk-0.10.7
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bin/omf.mjs test/e2e.test.mjs README.md test/smoke-codebuff.mjs \
            .github/workflows/ci.yml .github/workflows/codebuff-canary.yml \
            test/fixtures/codebuff-sdk-0.10.7/package.json \
            test/fixtures/codebuff-sdk-0.10.7/package-lock.json
          git commit -m 'fix: address CodeRabbit review findings'
          git push origin HEAD:feat/v0.3.0-hardening
