name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Stable runtime compatibility gate. Both the SDK version and its transitive
  # dependency graph are committed in the fixture lockfile.
  codebuff-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: test/fixtures/codebuff-sdk-0.10.7/package-lock.json
      - run: npm ci --prefix test/fixtures/codebuff-sdk-0.10.7
      - name: Smoke-test pinned Codebuff SDK graph
        run: npm run smoke
        env:
          OMF_CODEBUFF_SDK_ROOT: ${{ github.workspace }}/test/fixtures/codebuff-sdk-0.10.7
