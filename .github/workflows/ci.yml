name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Stable runtime compatibility gate. Pin the SDK here so a surprise upstream
  # release cannot make an otherwise unrelated PR nondeterministically red.
  # The separate weekly canary workflow tests @latest and tells us when it is
  # safe/necessary to bump this known-good version.
  codebuff-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm i --no-save @codebuff/sdk@0.10.7
      - run: npm run smoke
